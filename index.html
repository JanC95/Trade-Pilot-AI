<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradePilot AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#f8fafc;font:15px system-ui}aside{position:fixed;width:235px;inset:0 auto 0 0;background:#111827;padding:26px 16px;border-right:1px solid #253247}h1,h2,h3{margin:0 0 14px}small,p{color:#94a3b8;line-height:1.6}b.accent{color:#22c55e}nav button{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:#94a3b8}nav button.active{background:#17382e;color:#4ade80}main{margin-left:235px;padding:32px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#172033;border:1px solid #253247;border-radius:12px;padding:20px;margin-bottom:16px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit;border:1px solid #253247;border-radius:7px;padding:10px;background:#0b1120;color:#f8fafc}button{cursor:pointer}button.primary{background:#22c55e;color:#07180e;font-weight:700}label{display:grid;gap:5px;color:#94a3b8}textarea{width:100%;min-height:90px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #253247}th{color:#94a3b8}svg{width:100%;height:auto}.muted{color:#94a3b8}.warn{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}pre{white-space:pre-wrap;font:inherit;line-height:1.65}.scroll{overflow:auto}@media(max-width:760px){aside{position:static;width:100%;padding:16px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{margin:0;padding:16px}header{align-items:flex-start;gap:10px}}
</style><aside><h2>◈ TradePilot <b class="accent">AI</b></h2><small>Navigate the markets with intelligence.</small><nav id="nav"></nav><p>Research workspace · Local account</p></aside><main><header><div><small>MARKET INTELLIGENCE PLATFORM</small><h1 id="heading"></h1></div><small id="date"></small></header><div id="view"></div></main><script>
const symbols=['EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','USD/CAD','XAU/USD','XAG/USD','NASDAQ 100','US30','US500'], pages=['Dashboard','AI Market Analysis','Market Watchlist','Analysis History','Trading Journal','Performance Analytics','Risk Calculator','Settings','Subscription and Billing'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let watch=read('tpwatch',symbols.slice(0,5)),history=read('tpRealHistory',[]),trades=read('tptrades',[]),settings=read('tpsettings',{}),report='',selected=settings.symbol||'XAU/USD',tf=settings.tf||'M15',current=0;const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join(''),card=(t,v)=>`<div class="card"><small>${t}</small><h2>${v}</h2></div>`,table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;function go(i){current=i;$('heading').textContent=pages[i];$('nav').innerHTML=pages.map((p,j)=>`<button class="${i===j?'active':''}" onclick="go(${j})">${p}</button>`).join('');let v=$('view');if(i===0)v.innerHTML=`<p>Actual market data only. Select an instrument to retrieve provider candles and AI analysis.</p><div class="grid">${[0,1,2,6,8].map(j=>`<div class="card"><h3>${symbols[j]}</h3><small>Price not retrieved</small><p><button onclick="selected=symbols[${j}];go(1)">Analyse market</button></p></div>`).join('')}</div><div class="card"><h3>Quick actions</h3><div class="row"><button class="primary" onclick="go(1)">Analyse market</button><button onclick="go(6)">Risk calculator</button><button onclick="go(4)">Add trade</button></div></div>`;if(i===1)v.innerHTML=`<div class="card row"><label>Instrument<select id="sym">${opts(symbols,selected)}</select></label><label>Timeframe<select id="tf">${opts(['M5','M15','M30','H1','H4','D1','W1'],tf)}</select></label></div><div class="card"><h3>Chart workspace</h3><p>Actual provider candles, indicators and available economic events are retrieved automatically. No simulated fallback.</p><div id="livechart"></div><button id="scan" class="primary" onclick="analyse()">Analyse market with AI</button></div><div class="card"><h3>Analysis report</h3><pre id="report">${esc(report||'Select an instrument and timeframe to begin.')}</pre><div class="row"><button onclick="saveReport()">Save analysis</button><button onclick="navigator.clipboard.writeText(report)">Copy report</button></div></div>`;if(i===2)v.innerHTML=`<div class="card"><div class="row"><select id="addsym">${opts(symbols)}</select><button onclick="watch=[...new Set([...watch,$('addsym').value])];write('tpwatch',watch);go(2)">Add instrument</button></div>${table(['Instrument','Market data','Actions'],watch.map((s,j)=>[esc(s),'Retrieve in analysis',`<button onclick="selected=watch[${j}];go(1)">Analyse</button> <button onclick="watch.splice(${j},1);write('tpwatch',watch);go(2)">Remove</button>`]))}</div>`;if(i===3)v.innerHTML=`<div class="card">${history.length?table(['Instrument','Date','Report'],history.map((h,j)=>[esc(h.symbol),esc(h.date),`<button onclick="report=history[${j}].report;selected=history[${j}].symbol;go(1)">Open</button>`])):'No saved analyses yet.'}</div>`;if(i===4)v.innerHTML=`<div class="card"><h3>Add trade</h3><form id="tradeform" class="grid"><label>Instrument<select name="symbol">${opts(symbols)}</select></label><label>Direction<select name="side"><option>BUY</option><option>SELL</option></select></label>${['Entry','Exit','Stop','Target','Profit','Risk amount'].map(x=>`<label>${x}<input name="${x}" type="number" step="any" required></label>`).join('')}<label>Strategy<input name="strategy"></label><label>Notes<input name="notes"></label><button class="primary">Save trade</button></form></div><div class="card">${table(['Instrument','Side','P/L',''],trades.map((t,j)=>[esc(t.symbol),esc(t.side),esc(t.Profit),`<button onclick="trades.splice(${j},1);write('tptrades',trades);go(4)">Delete</button>`]))}</div>`;if(i===4)$('tradeform').onsubmit=e=>{e.preventDefault();trades.push({...Object.fromEntries(new FormData(e.target)),date:new Date().toISOString()});write('tptrades',trades);go(4)};if(i===5){let p=trades.map(t=>+t.Profit),w=p.filter(x=>x>0),l=p.filter(x=>x<0),sum=a=>a.reduce((a,b)=>a+b,0);v.innerHTML=`<div class="grid">${card('Total trades',p.length)}${card('Win rate',p.length?(100*w.length/p.length).toFixed(1)+'%':'—')}${card('Net P/L',sum(p).toFixed(2))}${card('Profit factor',l.length?(sum(w)/-sum(l)).toFixed(2):'—')}</div><div class="card">${table(['Instrument','Profit'],trades.map(t=>[esc(t.symbol),esc(t.Profit)]))}</div>`}if(i===6)v.innerHTML=`<div class="card"><div class="grid">${[['balance','Balance',10000],['risk','Risk %',1],['entry','Entry',100],['stop','Stop loss',98],['target','Target',104],['value','Account currency value per price unit per lot',1]].map(([id,l,n])=>`<label>${l}<input id="${id}" type="number" step="any" value="${n}" oninput="calc()"></label>`).join('')}</div><pre id="result"></pre><p>Enter broker-specific contract value including currency conversion. Excludes slippage and fees.</p></div>`;if(i===6)calc();if(i===7)v.innerHTML=`<div class="card"><label>Default symbol<select id="ss">${opts(symbols,selected)}</select></label><label>Default timeframe<select id="st">${opts(['M5','M15','M30','H1','H4','D1','W1'],tf)}</select></label><button onclick="selected=$('ss').value;tf=$('st').value;write('tpsettings',{symbol:selected,tf});alert('Saved locally')">Save preferences</button><p>Cloud authentication and notifications not configured.</p></div>`;if(i===8)v.innerHTML=`<div class="grid">${['Free','Pro','AI Premium'].map((p,j)=>card(p,['Basic journal','Full journal and analytics','AI analysis and history'][j])).join('')}</div><p>Billing is not configured. No payments are collected.</p>`}function calc(){let b=+$('balance').value,r=+$('risk').value,e=+$('entry').value,s=+$('stop').value,t=+$('target').value,v=+$('value').value,d=Math.abs(e-s);$('result').textContent=b>0&&r>0&&r<=100&&d>0&&v>0?`Risk amount: ${(b*r/100).toFixed(2)}\nPosition size estimate: ${(b*r/100/d/v).toFixed(4)} lots\nReward/risk: ${(Math.abs(t-e)/d).toFixed(2)}`:'Enter valid positive inputs and distinct stop.'}async function analyse(){selected=$('sym').value;tf=$('tf').value;const token=sessionStorage.getItem('tpAccess')||prompt('Enter your private preview access password (once per session)');if(!token)return;sessionStorage.setItem('tpAccess',token);report='';$('report').textContent='Retrieving market data and analysing…';$('livechart').innerHTML='';$('scan').disabled=true;try{let res=await fetch('/api/analyse',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({symbol:selected,timeframe:tf})}),j=await res.json();if(!res.ok){if(res.status===401)sessionStorage.removeItem('tpAccess');throw Error(j.error||'Request failed')}report=`${j.source} | Candle timestamp UTC: ${j.timestamp} | News: ${j.news}\n\n${j.report}`;if(current!==1)return;$('report').textContent=report;drawLive(j)}catch(e){if(current===1)$('report').textContent='Analysis unavailable: '+e.message}finally{if($('scan'))$('scan').disabled=false}}function drawLive(j){const a=j.candles,l=j.levels,vals=a.flatMap(x=>[x.h,x.l]).concat(l?[l.entry,l.sl,l.tp1,l.tp2]:[]),lo=Math.min(...vals),hi=Math.max(...vals),y=v=>20+220*(hi-v)/(hi-lo||1),x=i=>10+i*8;let svg=a.map((c,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${c.c>=c.o?'#22c55e':'#ef4444'}"/><rect x="${x(i)-2}" y="${Math.min(y(c.o),y(c.c))}" width="5" height="${Math.max(1,Math.abs(y(c.o)-y(c.c)))}" fill="${c.c>=c.o?'#22c55e':'#ef4444'}"/>`).join('');if(l){svg+=Object.entries({ENTRY:l.entry,SL:l.sl,TP1:l.tp1,TP2:l.tp2}).map(([k,v])=>`<path d="M0 ${y(v)}H690" stroke="${k==='SL'?'#ef4444':'#38bdf8'}" stroke-dasharray="4 4"/><text x="695" y="${y(v)}" fill="#f8fafc" font-size="10">${k} ${v.toPrecision(7)}</text>`).join('');svg+=`<path d="M522 ${y(l.entry)} L580 ${y(l.tp1)} L610 ${y((l.entry+l.tp1)/2)} L675 ${y(l.tp2)}" stroke="#22c55e" stroke-dasharray="6 4" fill="none"/>`}$('livechart').innerHTML=`<p>${esc(j.source)} · ${esc(j.timestamp)} UTC · ${esc(j.news)} news coverage</p><svg viewBox="0 0 850 260">${svg}</svg><p>Dashed path and levels are conditional rule-based candidates, not confirmed AI recommendations or future prices. Read the AI report for validation.</p>`}function saveReport(){if(!report)return;history.unshift({symbol:selected,date:new Date().toISOString(),report});write('tpRealHistory',history);alert('Saved locally')}$('date').textContent=new Date().toLocaleDateString();go(0);
</script></html>
